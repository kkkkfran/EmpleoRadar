[project]
name = "empleoradar"
version = "0.1.0"
description = "Bot de Discord para búsqueda y postulación automática de empleos en Chile"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "discord.py~=2.4",
    "SQLAlchemy[asyncio]~=2.0",
    "greenlet>=3.0",
    "aiohttp~=3.11",
    "beautifulsoup4~=4.12",
    "apscheduler~=3.10",
    "pydantic~=2.10",
    "pydantic-settings~=2.11",
    "pypdf>=4.0",
    "python-dotenv~=1.0",
    "aiosqlite~=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.3",
    "pytest-asyncio~=0.24",
    "pytest-cov~=6.0",
    "ruff~=0.8",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
